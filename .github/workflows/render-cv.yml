name: Validate CV

on:
  push:
    branches:
      - main
      - master
    paths:
      - "_data/cv.yml"
      - "assets/pdf/cv_new.pdf"
      - ".github/workflows/render-cv.yml"
  workflow_call:
  workflow_dispatch:

jobs:
  validate:
    name: Validate CV data and PDF
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate CV artifacts
        run: |
          ruby -e 'require "yaml"; YAML.load_file("_data/cv.yml")'
          test -s assets/pdf/cv_new.pdf
          test "$(head -c 4 assets/pdf/cv_new.pdf)" = "%PDF"
